apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders-api
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: orders-api
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      canaryMetadata:
        labels:
          rollout-role: canary
      stableMetadata:
        labels:
          rollout-role: stable
      steps:
        - setWeight: 20
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: orders-canary-health
        - setWeight: 50
        - pause:
            duration: 120s
        - analysis:
            templates:
              - templateName: orders-canary-health
        - setWeight: 100
  template:
    metadata:
      labels:
        app: orders-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-cache-enable: "true"
        vault.hashicorp.com/agent-run-as-same-user: "true"
        vault.hashicorp.com/role: orders-api
    spec:
      serviceAccountName: orders-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-api
          image: ghcr.io/willianzanutooliveira/distributed-commerce-platform/orders:v1.0.0
          securityContext:
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: Vault__TokenFile
              value: /vault/secrets/token
            - name: Vault__SecretPath
              value: platform/orders
          envFrom:
            - configMapRef:
                name: orders-runtime-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-runtime-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  RabbitMq__Host: rabbitmq.platform.svc.cluster.local
  Keycloak__Authority: https://keycloak.example.com/realms/distributed-commerce
  Keycloak__MetadataAddress: https://keycloak.example.com/realms/distributed-commerce/.well-known/openid-configuration
  Keycloak__Issuer: https://keycloak.example.com/realms/distributed-commerce
  Keycloak__Audience: distributed-commerce-api
  Keycloak__RequireHttpsMetadata: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  Vault__Address: https://vault.vault.svc.cluster.local:8200
  Vault__TokenFile: /vault/secrets/token
  Vault__SecretPath: platform/orders
  Vault__DatabaseRole: orders-app
  Vault__DatabaseConnectionStringName: orders-db
  Vault__DatabaseHost: orders-db.platform.svc.cluster.local
  Vault__DatabasePort: "5432"
  Vault__DatabaseName: orders
  Vault__DatabaseRuntimeRole: orders_runtime

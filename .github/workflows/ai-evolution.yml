name: AI Evolution Harness

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Small, reviewable engineering task for the AI agent"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-evolution-${{ github.repository }}
  cancel-in-progress: false

jobs:
  engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require OpenAI API credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Configure repository secret OPENAI_API_KEY before running the AI harness." >&2
            exit 1
          fi

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.160.0

      - name: Run implementation agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_TASK: ${{ inputs.task }}
        run: |
          PROMPT="$(cat .ai/prompts/engineer.md)"
          codex exec --full-auto "$PROMPT

          Requested task:
          $AI_TASK"

      - name: Protect harness governance
        run: |
          protected='^(AGENTS\.md|\.ai/engineering-constitution\.md|\.ai/prompts/engineer\.md|\.github/workflows/ai-evolution\.yml)$'
          if git diff --name-only | grep -Eq "$protected"; then
            echo "The AI agent attempted to modify protected governance files." >&2
            git diff --name-only
            exit 1
          fi

      - name: Restore
        run: dotnet restore DistributedCommerce.slnx

      - name: Build
        run: dotnet build DistributedCommerce.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DistributedCommerce.slnx --configuration Release --no-build --verbosity normal

      - name: Validate Docker Compose
        run: docker compose config >/dev/null

      - name: Ensure the task produced a change
        run: |
          if git diff --quiet; then
            echo "The AI agent produced no repository changes." >&2
            exit 1
          fi

      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AI_TASK: ${{ inputs.task }}
        run: |
          BRANCH="ai/evolution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TITLE="$(printf '%s' "$AI_TASK" | head -n 1 | cut -c 1-80)"

          git config user.name "distributed-commerce-ai"
          git config user.email "distributed-commerce-ai@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "AI-assisted evolution: $TITLE"
          git push origin "$BRANCH"

          cat > /tmp/pr-body.md <<EOF
          ## AI-assisted change

          Requested task:

          $AI_TASK

          Quality gates:
          - dotnet restore
          - Release build
          - automated tests
          - docker compose config
          - protected harness files unchanged

          Review policy:

          This pull request was generated by the repository AI engineering harness. It is intentionally not auto-merged. Human review remains required.
          EOF

          gh pr create             --base main             --head "$BRANCH"             --title "AI-assisted evolution: $TITLE"             --body-file /tmp/pr-body.md

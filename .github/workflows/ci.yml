name: CI

on:
  push:
    branches: [ main, distributed-commerce-platform ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-containers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DistributedCommerce.slnx

      - name: Build
        run: dotnet build DistributedCommerce.slnx --configuration Release --no-restore

      - name: Validate static security invariants
        run: bash scripts/security-config-check.sh

      - name: Validate Aspire AppHost
        run: dotnet build src/Platform/DistributedCommerce.AppHost/DistributedCommerce.AppHost.csproj --configuration Release --no-restore

      - name: Verify formatting and analyzers
        run: dotnet format DistributedCommerce.slnx --verify-no-changes --no-restore --severity warn

      - name: Test with coverage
        run: >
          dotnet test DistributedCommerce.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --filter "TestCategory!=Topology"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Validate Aspire resource model
        run: >
          dotnet test tests/DistributedCommerce.AppHost.Tests/DistributedCommerce.AppHost.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --filter "TestCategory=Topology"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build API Gateway image
        run: docker build -f src/Gateway/ApiGateway/Dockerfile -t distributed-commerce/gateway:ci .

      - name: Build Customers image
        run: docker build -f src/Services/Customers/Customers.Api/Dockerfile -t distributed-commerce/customers:ci .

      - name: Build Orders image
        run: docker build -f src/Services/Orders/Orders.Api/Dockerfile -t distributed-commerce/orders:ci .

      - name: Build Inventory image
        run: docker build -f src/Services/Inventory/Inventory.Service/Dockerfile -t distributed-commerce/inventory:ci .

      - name: Build Payments image
        run: docker build -f src/Services/Payments/Payments.Service/Dockerfile -t distributed-commerce/payments:ci .

      - name: Build Notifications image
        run: docker build -f src/Services/Notifications/Notifications.Service/Dockerfile -t distributed-commerce/notifications:ci .

      - name: Build Database Migrator image
        run: docker build -f src/Platform/DatabaseMigrator/Dockerfile -t distributed-commerce/database-migrator:ci .

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.vault.yml config >/dev/null

      - name: Gateway authentication and authorization smoke test
        run: |
          chmod +x scripts/auth-smoke.sh
          docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d --build api-gateway
          ./scripts/auth-smoke.sh

      - name: Adversarial API security smoke test
        run: bash scripts/security-smoke.sh

      - name: Verify migration ownership and runtime least privilege
        run: |
          migration_count="$(
            docker compose -f docker-compose.yml -f docker-compose.vault.yml exec -T               -e SQL='SELECT COUNT(*) FROM "__EFMigrationsHistory";'               orders-db sh -lc 'psql -U "$POSTGRES_USER" -d orders -Atc "$SQL"'
          )"

          if [ "$migration_count" -lt 1 ]; then
            echo "No EF Core migration was recorded for Orders." >&2
            exit 1
          fi

          runtime_can_create="$(
            docker compose -f docker-compose.yml -f docker-compose.vault.yml exec -T               -e SQL="SELECT has_schema_privilege('orders_runtime', 'public', 'CREATE');"               orders-db sh -lc 'psql -U "$POSTGRES_USER" -d orders -Atc "$SQL"'
          )"

          migrator_can_create="$(
            docker compose -f docker-compose.yml -f docker-compose.vault.yml exec -T               -e SQL="SELECT has_schema_privilege('orders_migrator', 'public', 'CREATE');"               orders-db sh -lc 'psql -U "$POSTGRES_USER" -d orders -Atc "$SQL"'
          )"

          if [ "$runtime_can_create" != "f" ]; then
            echo "orders_runtime unexpectedly has CREATE on schema public." >&2
            exit 1
          fi

          if [ "$migrator_can_create" != "t" ]; then
            echo "orders_migrator does not have CREATE on schema public." >&2
            exit 1
          fi

          migration_login="$(
            docker compose -f docker-compose.yml -f docker-compose.vault.yml exec -T               -e SQL="SELECT member_role.rolname FROM pg_auth_members membership JOIN pg_roles granted_role ON granted_role.oid = membership.roleid JOIN pg_roles member_role ON member_role.oid = membership.member WHERE granted_role.rolname = 'orders_migrator' AND member_role.rolcanlogin ORDER BY member_role.rolname LIMIT 1;"               orders-db sh -lc 'psql -U "$POSTGRES_USER" -d orders -Atc "$SQL"'
          )"

          if [ -z "$migration_login" ]; then
            echo "No Vault-generated temporary login is a member of orders_migrator." >&2
            exit 1
          fi

          if grep -R --include='*.cs' -n "EnsureCreatedAsync" src/Services; then
            echo "Runtime schema creation reappeared in a service." >&2
            exit 1
          fi

          echo "EF migrations, DDL/DML privilege split and migration identity confirmed."

      - name: Verify dynamic PostgreSQL credentials
        run: |
          dynamic_role="$(
            docker compose -f docker-compose.yml -f docker-compose.vault.yml exec -T               -e SQL="SELECT member_role.rolname FROM pg_auth_members membership JOIN pg_roles granted_role ON granted_role.oid = membership.roleid JOIN pg_roles member_role ON member_role.oid = membership.member WHERE granted_role.rolname = 'orders_runtime' AND member_role.rolcanlogin ORDER BY member_role.rolname LIMIT 1;"               orders-db sh -lc 'psql -U "$POSTGRES_USER" -d orders -Atc "$SQL"'
          )"

          if [ -z "$dynamic_role" ]; then
            echo "No temporary PostgreSQL login is a member of orders_runtime." >&2
            exit 1
          fi

          echo "Dynamic PostgreSQL login detected through orders_runtime membership."

          application_connection_string="$(
            docker compose -f docker-compose.yml -f docker-compose.vault.yml exec -T orders-api               sh -lc 'printenv "ConnectionStrings__orders-db" || true'
          )"

          if [ -n "$application_connection_string" ]; then
            echo "Effective database connection string leaked into the application environment." >&2
            exit 1
          fi

          echo "Application environment does not contain the effective database connection string."

          sleep 7
          docker compose -f docker-compose.yml -f docker-compose.vault.yml logs --no-color orders-api             | grep -q "Vault database credential lease renewed."

          echo "Vault database lease renewal confirmed."

      - name: Smoke stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.vault.yml logs --no-color vault vault-init keycloak api-gateway customers-api customers-db orders-api rabbitmq orders-db

      - name: Stop smoke stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.vault.yml down -v --remove-orphans
